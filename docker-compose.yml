services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agpal
      POSTGRES_PASSWORD: agpal
      POSTGRES_DB: agpal
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U agpal -d agpal']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
